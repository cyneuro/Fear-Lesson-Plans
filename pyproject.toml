[project]
name = "fear-lesson-plans"
version = "0.1.0"
description = "Fear learning educational Jupyter notebooks (local Poetry env + Colab)"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "neuron==9.0.2",
    "ipywidgets>=8.1,<9",
    "matplotlib>=3.7",
    "numpy>=1.23",
    "pandas>=2.0",
    "h5py>=3.8",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "notebook>=7.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
